# =============================================================================
# ThothCTL Space Configuration — Reference Documentation
# =============================================================================
#
# NOTE: This file is REFERENCE DOCUMENTATION ONLY. It is not loaded or parsed
# by thothctl at runtime. The actual spaces.toml is generated by
# SpaceService._create_space_config() when you run `thothctl init space`.
#
# This file documents the schema, valid values, and structure of spaces.toml
# to help users understand and manually edit their configuration if needed.
#
# Multiple spaces can be defined in a single spaces.toml file. Each space is
# a table under [spaces.<space-name>].
# =============================================================================

# =============================================================================
# Space 1: Development space example
# =============================================================================

[spaces.example-space]
# name (string, required): Human-readable identifier for the space.
# Must match the table key above.
name = "example-space"

# description (string, required): Brief description of the space's purpose.
description = "Example space for development"

# created_at (string, required): ISO 8601 timestamp of when the space was created.
# Automatically set by `thothctl init space`.
created_at = "2025-04-28T02:33:21"

[spaces.example-space.version_control]
# provider (string, required): Version control system provider.
# Valid values: "github", "gitlab", "azure_repos", "bitbucket", "codecommit"
provider = "github"

[spaces.example-space.terraform]
# registry (string, required): URL of the Terraform module registry.
# Use "https://registry.terraform.io" for the public registry,
# or an internal registry URL for private modules.
registry = "https://registry.terraform.io"

# auth_method (string, required): Authentication method for the registry.
# Valid values: "none", "token", "oidc", "iam"
auth_method = "none"

[spaces.example-space.orchestration]
# tool (string, required): IaC orchestration tool used in this space.
# Valid values: "terragrunt", "terraform", "tofu", "cdkv2"
tool = "terragrunt"

[spaces.example-space.governance]
# policy_repo (string, required): Git URL of the organization's policy repository.
# Contains OPA/Rego policies, Checkov custom checks, or terraform-compliance features.
policy_repo = "https://github.com/org/iac-policies.git"

# =============================================================================
# Space 2: Production fintech space example (multi-space configuration)
# =============================================================================

[spaces.fintech-prod]
name = "fintech-prod"
description = "Production infrastructure for fintech platform"
created_at = "2025-06-15T10:45:00"

[spaces.fintech-prod.version_control]
# Using GitLab for enterprise self-hosted VCS
provider = "gitlab"

[spaces.fintech-prod.terraform]
# Private registry for approved internal modules only
registry = "https://terraform.internal.fintech.com"
# Token-based auth for private registry access
auth_method = "token"

[spaces.fintech-prod.orchestration]
# OpenTofu for production workloads (open-source Terraform fork)
tool = "tofu"

[spaces.fintech-prod.governance]
# Strict compliance policies for financial services
policy_repo = "https://gitlab.internal.fintech.com/platform/iac-policies.git"
